<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" fill="none">
  <title>Blue atmosphere with flowing light trails</title>
  <desc>Deep cobalt and azure soften into a luminous turquoise glow at the lower right. Fine silver, cyan, and green curves sweep through the blue field, with scattered points of light.</desc>
  <defs>
    <linearGradient id="blue-field" x1="0" y1="620" x2="1920" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#064b9e"/><stop offset=".3" stop-color="#087ad9"/><stop offset=".64" stop-color="#138acc"/><stop offset="1" stop-color="#075296"/>
    </linearGradient>
    <linearGradient id="upper-depth" x1="960" y1="0" x2="960" y2="1060" gradientUnits="userSpaceOnUse">
      <stop stop-color="#063071" stop-opacity=".88"/><stop offset=".43" stop-color="#075498" stop-opacity=".27"/><stop offset="1" stop-color="#0873c2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="azure-wash" cx="0" cy="0" r="1" gradientTransform="translate(815 924) rotate(-18) scale(900 830)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#099afa" stop-opacity=".69"/><stop offset=".64" stop-color="#088bf4" stop-opacity=".33"/><stop offset="1" stop-color="#0986ed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-air" cx="0" cy="0" r="1" gradientTransform="translate(1450 815) rotate(-28) scale(788 920)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b3fbff" stop-opacity=".95"/><stop offset=".31" stop-color="#6de0f5" stop-opacity=".88"/><stop offset=".64" stop-color="#30c6e6" stop-opacity=".52"/><stop offset="1" stop-color="#42cbe8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="high-air" cx="0" cy="0" r="1" gradientTransform="translate(980 15) rotate(35) scale(515 1040)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29b7cb" stop-opacity=".36"/><stop offset="1" stop-color="#34c4da" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pearl-glow" cx="0" cy="0" r="1" gradientTransform="translate(1760 1072) rotate(-39) scale(358 705)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3fffe" stop-opacity=".97"/><stop offset=".24" stop-color="#dbfffd" stop-opacity=".86"/><stop offset=".58" stop-color="#c8fffa" stop-opacity=".45"/><stop offset="1" stop-color="#aff8fb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edge-shade" cx="0" cy="0" r="1" gradientTransform="translate(1100 780) scale(1390 1160)" gradientUnits="userSpaceOnUse">
      <stop offset=".55" stop-color="#052c69" stop-opacity="0"/><stop offset="1" stop-color="#032c65" stop-opacity=".33"/>
    </radialGradient>
    <linearGradient id="glass-ribbon" x1="130" y1="20" x2="1615" y2="1140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8dceef" stop-opacity=".06"/><stop offset=".42" stop-color="#72ccef" stop-opacity=".025"/><stop offset=".86" stop-color="#deffff" stop-opacity=".16"/><stop offset="1" stop-color="#e9ffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="silver-trail" x1="0" y1="20" x2="1210" y2="602" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0ffff" stop-opacity=".83"/><stop offset=".35" stop-color="#b6f4ff" stop-opacity=".55"/><stop offset=".65" stop-color="#7ddcec" stop-opacity=".16"/><stop offset="1" stop-color="#caffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aqua-trail" x1="370" y1="290" x2="1870" y2="1100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7cdbea" stop-opacity=".07"/><stop offset=".43" stop-color="#8fefed" stop-opacity=".26"/><stop offset=".82" stop-color="#e1ffff" stop-opacity=".49"/><stop offset="1" stop-color="#f3ffff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="green-trail" x1="360" y1="420" x2="1910" y2="1010" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67cc81" stop-opacity="0"/><stop offset=".28" stop-color="#7dd881" stop-opacity=".24"/><stop offset=".52" stop-color="#98e83d" stop-opacity=".78"/><stop offset=".74" stop-color="#8cdd6a" stop-opacity=".53"/><stop offset="1" stop-color="#d8f57a" stop-opacity=".09"/>
    </linearGradient>
    <linearGradient id="descending-green" x1="975" y1="15" x2="1900" y2="1190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ec79d" stop-opacity=".32"/><stop offset=".54" stop-color="#8dd773" stop-opacity=".26"/><stop offset="1" stop-color="#b0f399" stop-opacity=".57"/>
    </linearGradient>
    <linearGradient id="lower-light" x1="1250" y1="670" x2="1960" y2="1260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0ffff" stop-opacity="0"/><stop offset=".64" stop-color="#f2ffff" stop-opacity=".72"/><stop offset="1" stop-color="#efffff" stop-opacity=".11"/>
    </linearGradient>
    <filter id="soft-light" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="wide-softness" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="11"/></filter>
    <path id="upper-arc" d="M-17-15C85 191 249 276 494 297S810 334 774 412S787 507 973 552"/>
  </defs>

  <!-- Broad light fields leave the left side quiet and concentrate light at the lower right. -->
  <path fill="url(#blue-field)" d="M0 0h1920v1200H0z"/>
  <path fill="url(#upper-depth)" d="M0 0h1920v1200H0z"/>
  <path fill="url(#azure-wash)" d="M0 0h1920v1200H0z"/>
  <path fill="url(#high-air)" d="M0 0h1920v1200H0z"/>
  <path fill="url(#cyan-air)" d="M0 0h1920v1200H0z"/>
  <path fill="url(#pearl-glow)" d="M0 0h1920v1200H0z"/>
  <path fill="url(#edge-shade)" d="M0 0h1920v1200H0z"/>

  <!-- Translucent panes of light, with soft edges and open-ended arcs. -->
  <g fill="url(#glass-ribbon)">
    <path d="M-120-95C318 471 800 327 1330 772S1714 1023 2038 1260L1985 1311C1491 901 1043 659 752 493S102 301-120-95Z"/>
    <path d="M360-164C516 355 1072 587 1584 1009L1838 1215C1263 675 825 439 360-164Z" opacity=".57"/>
    <path d="M939-170C941 197 1217 603 1615 885S1881 1165 2030 1310L2050 1216C1832 958 1427 743 1197 472S1003 99 939-170Z" opacity=".34"/>
    <path d="M1158 409C1084 635 1437 822 1757 971S1930 1122 2030 1245C1699 897 1268 792 1158 409Z"/>
  </g>
  <g stroke="#a2e6ff" stroke-opacity=".075" fill="none" filter="url(#soft-light)">
    <path d="M-73 26C401 569 996 346 1630 1048" stroke-width="10"/>
    <path d="M635-54C775 417 1464 725 1810 1113" stroke-width="6"/>
    <path d="M937-89C1002 389 1397 637 1990 1103" stroke-width="7"/>
  </g>

  <!-- Hairline sweeps: silver above, cyan through the center, green accents below. -->
  <use href="#upper-arc" stroke="url(#silver-trail)" stroke-width="6" opacity=".18" filter="url(#soft-light)"/>
  <use href="#upper-arc" stroke="url(#silver-trail)" stroke-width="1.8"/>
  <g stroke="url(#aqua-trail)" stroke-width="1.1">
    <path d="M482 367C716 389 709 493 864 526S1338 623 1785 1002"/>
    <path d="M403 410C694 395 890 459 1042 491S1497 686 1921 1068" opacity=".7"/>
    <path d="M-93 561C431 595 1030 620 1498 727S1808 891 2032 1157" opacity=".42"/>
    <path d="M-50 1032C558 753 955 644 1241 659S1656 926 1950 1165" opacity=".28"/>
    <path d="M859 554C977 593 1131 615 1094 548S1052 467 1157 480S1451 665 1683 857" opacity=".49"/>
    <path d="M240 812C601 707 895 683 1106 718S1342 773 1333 709S1479 698 1687 849" opacity=".55"/>
    <path d="M654 66C707 450 1118 616 1509 826S1860 1132 1950 1236" opacity=".28"/>
    <path d="M485 111C471 365 777 453 965 578S1455 780 1809 991" opacity=".28"/>
  </g>
  <g stroke="url(#green-trail)" stroke-width="1.2">
    <path d="M420 552C795 532 1124 548 1390 633S1747 775 1927 938"/>
    <path d="M-38 858C376 660 638 673 929 729S1344 791 1603 839S1826 972 1980 1180" opacity=".7"/>
    <path d="M302 878C770 845 959 956 1263 945S1673 960 1927 1148" opacity=".83"/>
  </g>
  <g stroke="url(#descending-green)" stroke-width="1.3">
    <path d="M963-49C971 293 1182 521 1386 698S1722 904 1953 1228"/>
    <path d="M964 119C1026 437 1347 665 1615 807S1866 1062 1966 1260" opacity=".27"/>
    <path d="M1576 807C1684 927 1819 1039 1923 1203" stroke-width="2" opacity=".63"/>
  </g>

  <!-- Bright ribbons gather inside the bottom-right glow. -->
  <g fill="url(#lower-light)">
    <path d="M1167 595C1321 763 1622 848 1738 973S1853 1134 1972 1252L1957 1203C1804 982 1675 910 1520 822S1279 687 1167 595Z" opacity=".44"/>
    <path d="M1390 822C1572 900 1752 1019 1869 1171L1932 1230C1824 1059 1617 913 1390 822Z" opacity=".69"/>
    <path d="M1587 928C1757 1016 1802 1036 1966 1082L1948 1095C1797 1053 1712 1000 1587 928Z" opacity=".41"/>
  </g>
  <g stroke="url(#lower-light)" stroke-width="1.2">
    <path d="M1161 590C1304 748 1515 837 1704 966S1814 1137 1967 1244"/>
    <path d="M1231 603C1393 837 1649 862 1840 1139" opacity=".49"/>
    <path d="M1442 806C1666 928 1815 986 1925 1103" stroke-width="2" opacity=".73"/>
    <path d="M1395 904C1679 950 1783 1071 1917 1222" opacity=".72"/>
    <path d="M1477 766C1646 895 1799 1009 1880 1174" opacity=".55"/>
  </g>

  <!-- Quiet bokeh and irregular pinpoints; intentionally sparse. -->
  <g fill="#a6f2ff">
    <circle cx="436" cy="593" r="10" opacity=".045"/><circle cx="791" cy="517" r="6" opacity=".055"/>
    <circle cx="1054" cy="518" r="12" opacity=".025"/><circle cx="1324" cy="650" r="8.5" opacity=".48"/>
    <circle cx="1407" cy="705" r="5" opacity=".3"/><circle cx="1503" cy="837" r="8" opacity=".13"/>
    <circle cx="1624" cy="791" r="10" opacity=".22"/><circle cx="1654" cy="812" r="5" opacity=".2"/>
    <circle cx="1645" cy="895" r="15" opacity=".1"/><circle cx="1704" cy="948" r="12" opacity=".19"/>
  </g>
  <g fill="#e3ffff">
    <circle cx="481" cy="366" r="1.2" opacity=".66"/><circle cx="1223" cy="297" r="1" opacity=".23"/>
    <circle cx="1545" cy="579" r="1.1" opacity=".57"/><circle cx="1560" cy="571" r=".7" opacity=".63"/>
    <circle cx="1502" cy="591" r="1" opacity=".4"/><circle cx="1474" cy="716" r="1" opacity=".48"/>
    <circle cx="1385" cy="744" r="1.8" opacity=".5"/><circle cx="1438" cy="761" r="1.2" opacity=".68"/>
    <circle cx="1654" cy="719" r="1.7" opacity=".68"/><circle cx="1580" cy="755" r="1.7" opacity=".71"/>
    <circle cx="1555" cy="803" r=".8" opacity=".48"/><circle cx="1572" cy="818" r="1.5" opacity=".66"/>
    <circle cx="1499" cy="817" r="1" opacity=".38"/><circle cx="1524" cy="848" r="1.4" opacity=".47"/>
    <circle cx="1573" cy="862" r=".9" opacity=".71"/><circle cx="1587" cy="839" r="1.4" opacity=".55"/>
    <circle cx="1633" cy="858" r="1.3" opacity=".72"/><circle cx="1656" cy="875" r="1.8" opacity=".56"/>
    <circle cx="1691" cy="891" r="1" opacity=".73"/><circle cx="1637" cy="912" r="1.5" opacity=".46"/>
    <circle cx="1678" cy="927" r="1.3" opacity=".77"/><circle cx="1712" cy="938" r="1.6" opacity=".67"/>
    <circle cx="1741" cy="917" r=".8" opacity=".53"/><circle cx="1765" cy="962" r="1.1" opacity=".56"/>
    <circle cx="1727" cy="991" r="1.1" opacity=".59"/><circle cx="1664" cy="987" r=".7" opacity=".52"/>
    <circle cx="1761" cy="1005" r="1.8" opacity=".62"/><circle cx="1802" cy="1034" r="1.3" opacity=".69"/>
  </g>

</svg>
